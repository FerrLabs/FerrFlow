[workspace]
members = [".", "ferrflow-wasm"]
exclude = ["__fixtures__"]
resolver = "3"

# The codebase keeps unit tests inline before the impl block in formats/*.rs
# (cleaner test-first reading order). Suppressing the lint workspace-wide
# avoids reorganising every format file just to satisfy clippy.
[workspace.lints.clippy]
items_after_test_module = "allow"

[package]
name = "ferrflow"
version = "7.13.0"
edition = "2024"
description = "Universal semantic versioning for monorepos and classic repos"
license = "MIT"
repository = "https://github.com/FerrLabs/FerrFlow"
homepage = "https://github.com/FerrLabs/FerrFlow"
keywords = ["semver", "versioning", "monorepo", "changelog", "release"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "ferrflow"
path = "src/main.rs"

[lib]
name = "ferrflow"
path = "src/lib.rs"

[lints]
workspace = true

[features]
default = ["cli"]
cli = ["dep:gix", "dep:gix-traverse", "dep:gix-diff", "dep:ureq", "dep:clap", "dep:clap_complete", "dep:colored", "dep:mimalloc", "dep:rayon", "dep:tracing-subscriber", "dep:serde_norway"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
json5 = "1.0"
toml_edit = { version = "0.25", features = ["serde"] }
semver = "1"
base64 = "0.23"
regex = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
glob-match = "0.2"

# CLI-only dependencies
clap = { version = "4", features = ["derive", "env"], optional = true }
clap_complete = { version = "4", optional = true }
colored = { version = "3", optional = true }
gix = { version = "0.87", default-features = false, features = ["sha1", "max-performance-safe", "revision"], optional = true }
gix-traverse = { version = "0.61", optional = true }
gix-diff = { version = "0.67", default-features = false, features = ["sha1"], optional = true }
ureq = { version = "3", features = ["json"], optional = true }
# YAML source configs for `ferrflow migrate` (cli-only). Maintained serde_yaml fork.
serde_norway = { version = "0.9", optional = true }
sha2 = "0.11.0"
hex = "0.4.3"
# mimalloc: faster allocator for the CLI hot paths (TagIndex::build,
# revwalk, regex captures). Typical 5-15% wall-time win on alloc-heavy
# workloads — see #507. CLI-only (no value for the wasm build).
mimalloc = { version = "0.1", default-features = false, optional = true }
# rayon: data-parallel per-package planning compute (#476). CLI-only —
# the wasm build does no git/monorepo scanning, so it must not pull rayon.
rayon = { version = "1", optional = true }
# tracing: structured logging foundation (#513). The macro facade is
# always compiled (it no-ops without an installed subscriber) so shared
# code reachable from the wasm build can emit events. Only the subscriber
# — human (custom message-only) + JSON fmt layers plus EnvFilter
# (RUST_LOG / verbose) — is CLI-only; the wasm build installs none.
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "json"], optional = true }
# tempfile is used at runtime by the TS config loader to drop the
# generated wrapper script in a directory we own (security: writing into
# the user's config directory is a symlink TOCTOU). Tests also use it.
tempfile = "3"

[dev-dependencies]
cargo-husky = { version = "1", default-features = false, features = ["user-hooks"] }
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "ferrflow_benchmarks"
harness = false

[profile.release]
# Strip debug symbols. Cuts cargo build --release output from ~17 MB to
# ~5 MB. The release tarballs we ship were already stripped by the
# packager step, but the unstripped local build was what the bench
# runner reported as ferrflow_binary_size_mb, overstating the real
# download by ~3x on /performance.
strip = "symbols"
# Fat LTO: whole-program inlining + dead code elimination. Costs a couple
# of extra minutes over thin on the one-per-release CI build; combined
# with panic=abort below it cuts the binary by ~27% (#709).
lto = "fat"
# One codegen unit per crate so LTO can see across modules.
codegen-units = 1
# A CLI treats every panic as fatal, so the unwinding machinery (landing
# pads + std unwind tables) is a quarter of the binary bought for
# nothing. Trade-off: a panic inside a rayon worker aborts the process
# raw (SIGABRT) instead of propagating as a tidy panic message. Cargo
# forces unwind back on for test/bench profiles, so the test harness and
# criterion are unaffected.
panic = "abort"
