name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Secrets + CVE
    permissions:
      contents: read
      security-events: write
    uses: FerrLabs/.github/.github/workflows/reusable-security-scan.yml@a5886d74297dafc6aed9ee9f9aa75d7a06c831ca # main
    secrets: inherit
