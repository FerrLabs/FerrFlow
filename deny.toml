[graph]
all-features = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "Marvin timing sidechannel in `rsa`, never fixed upstream. This service does use the RSA path: `jsonwebtoken` is pulled with `rust_crypto`, and `bot/app_jwt.rs` signs the GitHub App JWT with RS256, which GitHub mandates. Marvin is a chosen-ciphertext timing attack on RSA *decryption*; the bot signs with a local key and never decrypts attacker-supplied input, so there is no oracle to time. Reviewed in #1445: the only RSA private-key operation is signing in `bot/app_jwt.rs`; the verification paths (`bot/oidc_verify.rs`, `bot/jwks.rs`) use public keys only, so neither path decrypts. Closing it means moving `jsonwebtoken` off `rust_crypto` (e.g. `aws_lc_rs`, which adds a C build dependency), tracked in #1445. Do not copy this reasoning to another product without checking it." },
    { id = "RUSTSEC-2026-0387", reason = "Timing variability in `crypto-bigint` 0.5.5, fixed only in >=0.7.6. The 0.5 line is pulled by the RustCrypto 0.13 stack (`elliptic-curve`, `rsa`) under `jsonwebtoken`, which has no release on the patched line yet. Drop this once `jsonwebtoken` moves to a patched `crypto-bigint`." },
    { id = "RUSTSEC-2026-0543", reason = "`chrono` is flagged unmaintained, not vulnerable. It is a direct dependency of the CLI and the API for UTC/local timestamps, with no replacement adopted yet. Drop this once the date handling moves to a maintained crate." },
    { id = "RUSTSEC-2026-0574", reason = "`heapless` 0.8.0 is flagged unsound. It is pulled only by `faster-hex` 0.10 under `gix-hash`, which requires heapless ^0.8 while the fix is on 0.9. Drop this once `gix` moves to a patched `faster-hex`, tracked in #1452." },
    { id = "RUSTSEC-2026-0575", reason = "`heapless` 0.8.0 is flagged unsound. It is pulled only by `faster-hex` 0.10 under `gix-hash`, which requires heapless ^0.8 while the fix is on 0.9. Drop this once `gix` moves to a patched `faster-hex`, tracked in #1452." },
    { id = "RUSTSEC-2026-0576", reason = "`heapless` 0.8.0 is flagged unsound. It is pulled only by `faster-hex` 0.10 under `gix-hash`, which requires heapless ^0.8 while the fix is on 0.9. Drop this once `gix` moves to a patched `faster-hex`, tracked in #1452." },
    { id = "RUSTSEC-2026-0577", reason = "`heapless` 0.8.0 is flagged unsound. It is pulled only by `faster-hex` 0.10 under `gix-hash`, which requires heapless ^0.8 while the fix is on 0.9. Drop this once `gix` moves to a patched `faster-hex`, tracked in #1452." },
    { id = "RUSTSEC-2026-0578", reason = "`heapless` 0.8.0 is flagged unsound. It is pulled only by `faster-hex` 0.10 under `gix-hash`, which requires heapless ^0.8 while the fix is on 0.9. Drop this once `gix` moves to a patched `faster-hex`, tracked in #1452." },
    { id = "RUSTSEC-2026-0579", reason = "`heapless` 0.8.0 is flagged unsound. It is pulled only by `faster-hex` 0.10 under `gix-hash`, which requires heapless ^0.8 while the fix is on 0.9. Drop this once `gix` moves to a patched `faster-hex`, tracked in #1452." },
    { id = "RUSTSEC-2026-0580", reason = "`heapless` 0.8.0 is flagged unsound. It is pulled only by `faster-hex` 0.10 under `gix-hash`, which requires heapless ^0.8 while the fix is on 0.9. Drop this once `gix` moves to a patched `faster-hex`, tracked in #1452." },
