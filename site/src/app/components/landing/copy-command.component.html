<div class="cmd">
  <pre
    class="mono cmd-text"
  ><code>@if (prompt()) {<span class="cmd-prompt" aria-hidden="true">$ </span>}{{ command() }}</code></pre>
  <button type="button" class="mono cmd-copy" (click)="copy()">
    @switch (status()) {
      @case ('copied') {
        <span i18n="@@copy.done">Copied</span>
      }
      @case ('failed') {
        <span i18n="@@copy.failed">Copy failed</span>
      }
      @default {
        <span i18n="@@copy.action">Copy</span>
      }
    }
  </button>
  <span class="sr-only" aria-live="polite">
    @switch (status()) {
      @case ('copied') {
        <span i18n="@@copy.announce">Command copied to the clipboard</span>
      }
      @case ('failed') {
        <span i18n="@@copy.failedAnnounce">Could not copy the command, select it instead</span>
      }
    }
  </span>
</div>
