name: Fuzz

on:
  pull_request:
    paths:
      - 'src/**'
      - 'fuzz/**'
      - 'api/**'
      - '.github/workflows/changes.yml'
      - 'scripts/changed-paths.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/fuzz.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed paths
    uses: ./.github/workflows/changes.yml

  smoke:
    name: Smoke
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.cli == 'true'
    permissions:
      contents: read
    uses: FerrLabs/.github/.github/workflows/reusable-fuzz-rust.yml@598b7c967f0c8388eb0e5df22b9ad8783a2989f0 # main
    with:
      max-total-time: 45
      timeout-minutes: 20

  nightly:
    name: Nightly
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: FerrLabs/.github/.github/workflows/reusable-fuzz-rust.yml@598b7c967f0c8388eb0e5df22b9ad8783a2989f0 # main
    with:
      max-total-time: 600
      timeout-minutes: 60

  api-smoke:
    name: API smoke
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.api == 'true'
    permissions:
      contents: read
    uses: FerrLabs/.github/.github/workflows/reusable-fuzz-rust.yml@598b7c967f0c8388eb0e5df22b9ad8783a2989f0 # main
    with:
      working-directory: api
      max-total-time: 45
      timeout-minutes: 20

  api-nightly:
    name: API nightly
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: FerrLabs/.github/.github/workflows/reusable-fuzz-rust.yml@598b7c967f0c8388eb0e5df22b9ad8783a2989f0 # main
    with:
      working-directory: api
      max-total-time: 300
      timeout-minutes: 45
