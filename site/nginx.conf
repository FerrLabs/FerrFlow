server {
    listen 8080;
    absolute_redirect off;
    port_in_redirect off;
    server_name_in_redirect off;
    root /usr/share/nginx/html;

    error_page 404 /404/index.html;

    # Prerendered pages live in per-slug directories, so intermediate paths
    # (/docs/, /docs/ci/, /v4/docs/) are real directories with no index.html.
    # try_files resolves them, finds no index, and nginx answers 403 before
    # error_page 404 can run — a bare Forbidden instead of the styled page.
    # Serve the same 404 for those, with a 404 status.
    error_page 403 =404 /404/index.html;

    location = /en { return 301 /; }
    location ^~ /en/ { rewrite ^/en(/.*)$ $1 permanent; }

    location = /cli { return 301 /; }
    location = /cli/ { return 301 /; }
    location = /fr/cli { return 301 /fr/; }
    location = /fr/cli/ { return 301 /fr/; }

    # The docs root is a path people land on and trim to by hand; send it to
    # the first page rather than a 404. Section directories (/docs/ci/) have
    # no landing page and keep falling through to the 404 above.
    location = /docs { return 301 /docs/introduction/; }
    location = /docs/ { return 301 /docs/introduction/; }
    location = /fr/docs { return 301 /fr/docs/introduction/; }
    location = /fr/docs/ { return 301 /fr/docs/introduction/; }
    location ~ ^/(v[0-9]+)/docs/?$ { return 301 /$1/docs/introduction/; }
    location ~ ^/fr/(v[0-9]+)/docs/?$ { return 301 /fr/$1/docs/introduction/; }

    location /assets/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.ferrlabs.com https://api.ferrflow.com https://rum.ferrlabs.com; frame-ancestors 'none'; base-uri 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(woff2?|ttf|eot|otf|png|jpg|jpeg|gif|webp|avif|ico|svg)$ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.ferrlabs.com https://api.ferrflow.com https://rum.ferrlabs.com; frame-ancestors 'none'; base-uri 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location ~ ^/(robots\.txt|sitemap.*\.xml|manifest\.(json|webmanifest))$ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.ferrlabs.com https://api.ferrflow.com https://rum.ferrlabs.com; frame-ancestors 'none'; base-uri 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.ferrlabs.com https://api.ferrflow.com https://rum.ferrlabs.com; frame-ancestors 'none'; base-uri 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ $uri/index.html =404;
    }
}
