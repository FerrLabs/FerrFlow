name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Secrets + CVE
    permissions:
      contents: read
      security-events: write
    uses: FerrLabs/.github/.github/workflows/reusable-security-scan.yml@bd2cd50e9c38bbab1194040edbf92c29809029a5 # main
    secrets: inherit
