server {
    listen 80;
    root /usr/share/nginx/html;

    error_page 404 /404.html;

    # Marketing site — relaxed CSP because Starlight emits inline scripts for
    # theme switching, search, etc. We still lock the structural headers
    # (frame-ancestors, base-uri) and the clickjacking / sniffing guards.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.ferrflow.com; frame-ancestors 'none'; base-uri 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
