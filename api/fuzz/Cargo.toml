[package]
name = "ferrflow-api-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
serde_json = "1"
ferrflow-api = { path = "..", features = ["fuzzing"] }

[workspace]

[[bin]]
name = "preview"
path = "fuzz_targets/preview.rs"
test = false
doc = false
bench = false

[[bin]]
name = "webhook_signature"
path = "fuzz_targets/webhook_signature.rs"
test = false
doc = false
bench = false

[[bin]]
name = "oidc_policy"
path = "fuzz_targets/oidc_policy.rs"
test = false
doc = false
bench = false
