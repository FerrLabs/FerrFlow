name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Secrets + CVE
    permissions:
      contents: read
      security-events: write
    uses: FerrLabs/.github/.github/workflows/reusable-security-scan.yml@62c6b804849d373be662d07950af93db8fc7ddd6 # main
    secrets: inherit
