[package]
name = "ferrflow-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
ferrflow = { path = "..", default-features = false }

[profile.release]
debug = true

[[bin]]
name = "config_parse"
path = "fuzz_targets/config_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "version_file"
path = "fuzz_targets/version_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "commit_analysis"
path = "fuzz_targets/commit_analysis.rs"
test = false
doc = false
bench = false

[[bin]]
name = "next_version"
path = "fuzz_targets/next_version.rs"
test = false
doc = false
bench = false
