name: Install cosign
description: Download a pinned cosign release with retries and verify its checksum.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        COSIGN_VERSION: v3.1.3
        SHA256_AMD64: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
        SHA256_ARM64: c5d324e091826b0d7a78eb16fef316450b4eb9aaec045611c08ba06f5e73220a
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        set -euo pipefail
        case "$RUNNER_ARCH" in
          X64) arch=amd64 sha="$SHA256_AMD64" ;;
          ARM64) arch=arm64 sha="$SHA256_ARM64" ;;
          *) echo "Unsupported runner architecture: $RUNNER_ARCH" >&2; exit 1 ;;
        esac
        download="$RUNNER_TEMP/cosign"
        curl -fsSL \
          --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 20 \
          -o "$download" \
          "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-${arch}"
        echo "${sha}  $download" | sha256sum --check --strict
        sudo install -m 0755 "$download" /usr/local/bin/cosign
        cosign version
