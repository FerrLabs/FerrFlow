[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "Marvin timing sidechannel in `rsa`, never fixed upstream. This service does use the RSA path: `jsonwebtoken` is pulled with `rust_crypto`, and `bot/app_jwt.rs` signs the GitHub App JWT with RS256, which GitHub mandates. Marvin is a chosen-ciphertext timing attack on RSA *decryption*; the bot signs with a local key and never decrypts attacker-supplied input, so there is no oracle to time. Do not copy this reasoning to another product without checking it. See #903." },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "Zlib",
  "MPL-2.0",
  # Kit crates (`ferrlabs-*`) declare this. Every product API consumes them,
  # so a snippet without it rejects the whole shared layer on adoption.
  "LicenseRef-FerrLabs-Proprietary",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Intra-workspace `path` dependencies carry no version and read as wildcards
# to cargo-deny. They are local crates, not unpinned registry dependencies.
allow-wildcard-paths = true
highlight = "all"
deny = [
  { crate = "proc-macro1", reason = "Malicious crate from the 2026-08-20 arrayref supply-chain attack." },
  { crate = "proc-macro-en", reason = "Malicious crate from the 2026-08-20 arrayref supply-chain attack." },
  { crate = "aovine", reason = "Malicious crate from the 2026-08-20 arrayref supply-chain attack." },
  { crate = "arone", reason = "Malicious crate from the 2026-08-20 arrayref supply-chain attack." },
  { crate = "aronenao", reason = "Malicious crate from the 2026-08-20 arrayref supply-chain attack." },
  { crate = "tinymember", reason = "Malicious crate from the 2026-08-20 arrayref supply-chain attack." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
  "https://github.com/rust-lang/crates.io-index",
  # Kellnr, the private registry serving the `ferrlabs-*` crates.
  "sparse+https://crates.ferrlabs.com/api/v1/crates/",
]
allow-git = [
  # First-party, and the dependency is pinned to an immutable rev rather than
  # a branch. `ferrflow` is the CLI consumed as a library and is not published
  # to crates.io as a lib.
  "https://github.com/FerrLabs/FerrFlow",
]
